name: Publish to npm

# Trusted Publishing (OIDC). No npm token, no authenticator code, nothing that
# expires. The sendable.me npm account uses a security key for 2FA and has no
# TOTP app, and npm's CLI has no WebAuthn publish flow -- so
# `npm publish --otp=<code>` can never succeed from a laptop. This is the only
# route that works, the same one wayleave itself uses.
#
# One-time setup on npmjs.com (package -> Settings -> Trusted Publisher):
#   Organization or user: gibrancorbin11-hub
#   Repository:           create-wayleave-app
#   Workflow filename:    publish.yml
#   Environment:          (leave blank)
#
# To ship a version:
#   1. bump "version" in package.json
#   2. git commit && git push
#   3. git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; runners ship older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Zero dependencies, so there is nothing to install.
      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Tag and package.json agree on $PKG"

      - name: Publish
        run: npm publish --access public --provenance
